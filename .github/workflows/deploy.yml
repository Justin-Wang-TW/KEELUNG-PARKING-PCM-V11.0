name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          # 在 GitHub「Settings → Secrets and variables → Actions → Variables」設定
          # VITE_SCRIPT_URL：測試用 Apps Script 網址（未設定則連到正式後端）
          # VITE_ENV_LABEL ：例如「V11 測試環境」
          VITE_SCRIPT_URL: ${{ vars.VITE_SCRIPT_URL }}
          VITE_ENV_LABEL: ${{ vars.VITE_ENV_LABEL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
